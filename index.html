const warriors=["Bill", "Dacia", "Larry", "Sharon", "Matt", "Peter", "Noel", "Gary", "Bonnie", "Ted"], questions=[{"category":"Luke & Acts","difficulty":"Easy","q":"Who was the mother of Jesus according to Luke's Gospel?","answers":["Mary","Elizabeth","Martha","Anna"],"correct":0,"explanation":"Luke 1 identifies Mary as the virgin pledged to Joseph who would give birth to Jesus."},{"category":"Luke & Acts","difficulty":"Easy","q":"Who baptized Jesus?","answers":["Peter","John the Baptist","James","Philip"],"correct":1,"explanation":"Luke 3 records Jesus being baptized during the ministry of John the Baptist."},{"category":"Luke & Acts","difficulty":"Easy","q":"According to Luke 2, in what town was Jesus born?","answers":["Nazareth","Jerusalem","Bethlehem","Capernaum"],"correct":2,"explanation":"Luke 2:4–7 places Jesus' birth in Bethlehem."},{"category":"Luke & Acts","difficulty":"Medium","q":"In Luke's Gospel, who asks Jesus, ‘And who is my neighbor?’","answers":["A Pharisee","An expert in the law","A Roman centurion","Peter"],"correct":1,"explanation":"Luke 10:29 records an expert in the law asking this question, leading into the parable of the Good Samaritan."},{"category":"Luke & Acts","difficulty":"Medium","q":"Which parable in Luke 15 tells of a son who leaves home, squanders his inheritance, and returns to his father?","answers":["The Good Samaritan","The Rich Fool","The Lost Son","The Sower"],"correct":2,"explanation":"Luke 15:11–32 is commonly called the parable of the Prodigal Son or Lost Son."},{"category":"Luke & Acts","difficulty":"Medium","q":"What happens at the beginning of Acts before the disciples begin their mission from Jerusalem?","answers":["Paul is converted","Jesus ascends","Stephen is martyred","Peter visits Cornelius"],"correct":1,"explanation":"Acts 1 records Jesus' ascension before the Spirit comes at Pentecost in Acts 2."},{"category":"Luke & Acts","difficulty":"Medium","q":"At Pentecost in Acts 2, what visible sign accompanied the coming const cats=['Mixed','Luke & Acts','General Bible','Paul & Corinthians','Jesus & Sermon on the Mount','David & Old Testament','Theology','Creasy Challenge']; const diffs=['Mixed','Easy','Medium','Hard','Creasy'];
let warrior='Ted',cat='Mixed',diff='Mixed',deck=[],idx=0,points=0,correct=0,locked=false;
// Persistent no-repeat history: questions are recorded when actually shown.
let seenQuestions; try{seenQuestions=new Set(JSON.parse(localStorage.getItem('ohw_seen_questions')||'[]'))}catch(e){seenQuestions=new Set()} const armor=['Belt of Truth','Breastplate of Righteousness','Gospel of Peace','Shield of Faith','Helmet of Salvation','Sword of the Spirit'];
function choices(id,arr,setter,def){let el=document.getElementById(id);arr.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{[...el.children].forEach(z=>z.classList.remove('selected'));b.classList.add('selected');setter(x)};if(x===def)b.classList.add('selected');el.appendChild(b)})}
choices('warriors',warriors,x=>warrior=x,'Ted');choices('cats',cats,x=>cat=x,'Mixed');choices('diffs',diffs,x=>diff=x,'Mixed');updateMastered();
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
document.getElementById('startBtn').onclick=()=>{
  const eligible=questions.filter(q=>(cat==='Mixed'||q.category===cat)&&(diff==='Mixed'||q.difficulty===diff));
  if(!eligible.length){alert('No questions in that combination yet. Try Mixed difficulty.');return}
  let fresh=eligible.filter(q=>!seenQuestions.has(q.q));
  // Strict no-repeat for the chosen pool. Recycle only after that entire pool has been seen.
  if(!fresh.length){
    eligible.forEach(q=>seenQuestions.delete(q.q));
    fresh=[...eligible];
    localStorage.setItem('ohw_seen_questions',JSON.stringify([...seenQuestions]));
    alert('🏆 You have seen every question in this selection. That question deck has now been reshuffled!');
  }
  deck=shuffle(fresh).slice(0,Math.min(15,fresh.length));
  idx=0;points=0;correct=0;
  document.getElementById('setup').classList.add('hidden');document.getElementById('game').classList.remove('hidden');show()};
function show(){locked=false;let q=deck[idx];seenQuestions.add(q.q);localStorage.setItem('ohw_seen_questions',JSON.stringify([...seenQuestions]));updateMastered();document.getElementById('game').classList.toggle('creasy',q.difficulty==='Creasy');document.getElementById('who').textContent='Warrior: '+warrior;document.getElementById('score').textContent='Score: '+points;document.getElementById('progress').textContent=`Question ${idx+1}/${deck.length}`;document.getElementById('label').textContent=(q.difficulty==='Creasy'?'🔥 CREASY CHALLENGE — ':q.difficulty+' — ')+q.category;document.getElementById('question').textContent=q.q;let a=document.getElementById('answers');a.innerHTML='';q.answers.forEach((t,i)=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>answer(i,b);a.appendChild(b)});document.getElementById('feedback').innerHTML='';document.getElementById('next').classList.add('hidden');updateArmor()}
function answer(i,b){if(locked)return;locked=true;let q=deck[idx],ok=i===q.correct,val=q.difficulty==='Creasy'?200:q.difficulty==='Hard'?150:q.difficulty==='Medium'?100:75;if(ok){points+=val;correct++;b.classList.add('correct');document.getElementById('feedback').innerHTML='<b>⚔️ CORRECT!</b> '+q.explanation}else{b.classList.add('wrong');document.getElementById('answers').children[q.correct].classList.add('correct');document.getElementById('feedback').innerHTML='<b>YIKES! Better bring that one to Office Hours.</b><br>'+q.explanation}document.getElementById('score').textContent='Score: '+points;updateArmor();document.getElementById('next').classList.remove('hidden')}
function updateMastered(){let valid=new Set(questions.map(q=>q.q));let n=[...seenQuestions].filter(q=>valid.has(q)).length;let el=document.getElementById('mastered');if(el)el.textContent=`Questions Seen: ${n} / ${questions.length}`}
function updateArmor(){let n=Math.min(6,Math.floor(correct/2));document.getElementById('armor').textContent='🛡️ Armor: '+(n?armor.slice(0,n).join(' • '):'—')}
document.getElementById('next').onclick=()=>{idx++;if(idx>=deck.length)finish();else show()};
function finish(){document.getElementById('game').classList.add('hidden');document.getElementById('end').classList.remove('hidden');let pct=Math.round(correct/deck.length*100),rank=pct===100?'FULL ARMOR — Outstanding!':pct>=80?'Warrior Ready!':pct>=60?'Strong showing — keep sharpening the sword.':'Back to the Scriptures, Warrior!';document.getElementById('final').innerHTML=`<h2>${warrior} scored ${points} points</h2><p class="armor">${correct} of ${deck.length} correct (${pct}%)</p><h2>${rank}</h2><p>“Take the helmet of salvation and the sword of the Spirit, which is the word of God.” — Ephesians 6:17 (NIV)</p>`}
</script></body></html>
